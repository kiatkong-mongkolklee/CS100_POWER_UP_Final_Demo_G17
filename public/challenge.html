<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verified Human Quiz</title>

  <!-- เชื่อม CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/challenge.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="navbar-brand">
      Learning Portfolio
    </a>
  </header>

  <main class="game-container">

    <div class="game-header">
      <h1>Verified Human</h1>
      <p>Let's test your knowledge!</p>
    </div>

    <div class="progress-area">
      <div class="progress-info">
        <span>YOUR PROGRESS</span>
        <span id="pct">0%</span>
      </div>

      <div class="progress-bar">
        <div id="fill"></div>
      </div>
    </div>

    <section class="quiz-card" id="card">
      <!-- คำถามจะแสดงตรงนี้ -->
    </section>

    <div class="mascot-area">
      <p id="bubble">พร้อมเล่นเกมหรือยัง? 😊</p>
    </div>

    <!-- ส่วน Export Challenge Item ตอนเล่นจบ -->
    <div id="export-challenge-section" class="export-section hidden">
      <h3>🎉 ยินดีด้วย! คุณผ่าน Challenge แล้ว!</h3>
      <p>กดปุ่มด้านล่างเพื่อสร้างโค้ด Portfolio Item JSON ไปใส่ในเว็บของคุณ</p>

      <button id="export-challenge-btn" type="button" class="btn-export">
        สร้าง Portfolio Item JSON
      </button>

      <div id="json-result-box" class="json-result-box hidden">
        <textarea id="challenge-item-json" class="json-textarea" rows="8" readonly></textarea>
        <button id="copy-json-btn" type="button" class="btn-copy">
          📋 Copy JSON
        </button>
      </div>
    </div>

  </main>

  <!-- เชื่อม JavaScript -->
  <script src="js/challenge quiz.js" defer></script>

</body>

</html>
